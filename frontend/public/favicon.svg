<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="rupeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Neo-Bank Dark Squircle Background -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="182" height="182" rx="39" fill="none" stroke="url(#tealGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Chimney -->
  <path d="M130 72 V48 H146 V84" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- House Silhouette Outline -->
  <path d="M34 94 L96 42 L158 94 V152 C158 155.3 155.3 158 152 158 H40 C36.7 158 34 155.3 34 152 Z" 
        fill="none" stroke="url(#tealGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Indian Rupee (₹) Symbol -->
  <!-- Top bar -->
  <line x1="68" y1="80" x2="114" y2="80" stroke="url(#rupeeGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Second bar -->
  <line x1="68" y1="96" x2="110" y2="96" stroke="url(#rupeeGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Stem & Head Arc -->
  <path d="M84 80 V110 C98 110 108 104 108 95 C108 86 98 80 84 80" fill="none" stroke="url(#rupeeGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Diagonal Leg -->
  <line x1="84" y1="110" x2="116" y2="142" stroke="url(#rupeeGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- Equal-Split Ledger Balance Indicators -->
  <line x1="126" y1="114" x2="146" y2="114" stroke="#2dd4bf" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="126" y1="126" x2="146" y2="126" stroke="#2dd4bf" stroke-width="6.5" stroke-linecap="round"/>
</svg>
